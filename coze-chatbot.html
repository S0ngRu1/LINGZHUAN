<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>希格玛智能工具平台</title>
  <script src="https://lf-cdn.coze.cn/obj/unpkg/flow-platform/chat-app-sdk/1.2.0-beta.18/libs/cn/index.js"></script>
  <style>
    /* 全局样式重置与基础设置 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #ffffff;
      /* 后续内容区域的背景色 */
      background-color: #111827;
    }

    /* 顶部导航栏 */
    .main-nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 3rem;
      background-color: rgba(17, 24, 39, 0.5); /* 半透明背景 */
      backdrop-filter: blur(10px); /* 玻璃拟态效果 */
      -webkit-backdrop-filter: blur(10px);
      z-index: 1000;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .nav-logo {
      font-size: 1.5rem;
      font-weight: bold;
    }

    .nav-links {
      display: flex;
      list-style: none;
      gap: 2rem;
    }

    .nav-links a {
      color: #e5e7eb;
      text-decoration: none;
      font-size: 1rem;
      padding: 0.5rem 0;
      position: relative;
      transition: color 0.3s ease;
    }

    .nav-links a:hover {
      color: #ffffff;
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      width: 0;
      height: 2px;
      bottom: 0;
      left: 50%;
      background-color: #3b82f6;
      transition: all 0.3s ease;
    }

    .nav-links a:hover::after {
      width: 100%;
      left: 0;
    }

    /* 主视觉区域 (Hero Section) */
    .hero-section {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }

    .hero-background {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      /* ======================================================= */
      /* === 修改点: 在这里替换为您自己的背景图片URL === */
      /* ======================================================= */
      background-image: url('https://images.unsplash.com/photo-1551288049-bebda4e38f71?q=80&w=2070&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      z-index: -2;
    }

    .hero-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(17, 24, 39, 0.7); /* 深色遮罩层，确保文字可读 */
      z-index: -1;
    }

    .hero-section h1 {
      font-size: 4rem;
      font-weight: 800;
      margin-bottom: 1rem;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.5);
    }

    .hero-section p {
      font-size: 1.25rem;
      color: #d1d5db;
      max-width: 600px;
      margin-bottom: 2rem;
    }

    .cta-button {
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 1rem 2.5rem;
      font-size: 1.1rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
    }

    .cta-button:hover {
      background-color: #1d4ed8;
      transform: translateY(-2px);
    }

    /* 功能区容器 */
    .tools-section-container {
      padding: 4rem 2rem;
      background-color: #111827;
    }

    /* 功能卡片样式 */
    .feature-card {
      background-color: rgba(31, 41, 55, 0.5); /* 半透明深色卡片 */
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 2rem;
      max-width: 900px;
      margin: 0 auto 3rem auto;
    }

    .feature-card h2 {
      color: #f9fafb;
      font-size: 1.8rem;
      margin-bottom: 1rem;
    }

    .feature-desc {
      color: #9ca3af;
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }

    .feature-actions textarea {
      width: 100%;
      min-height: 150px;
      padding: 1rem;
      border: 1px solid #4b5563;
      border-radius: 8px;
      font-size: 1rem;
      resize: vertical;
      background-color: #1f2937;
      color: #e5e7eb;
    }
     .feature-actions textarea:focus {
      outline: none;
      border-color: #2563eb;
    }

    .feature-actions button {
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 0.8rem 1.2rem;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
    }

    .result-display {
      margin-top: 1.5rem;
      padding: 1rem;
      border-radius: 8px;
      background-color: #1f2937;
      color: #9ca3af;
      min-height: 80px;
      display: none;
    }
    .result-display.active {
      display: block;
    }

    /* 隐藏功能区，默认不显示 */
    .hidden-section {
      display: none;
    }
  </style>
</head>
<body>
  <header class="main-nav">
    <div class="nav-logo">希格玛</div>
    <ul class="nav-links">
      <li><a href="#hero">首页</a></li>
      <li><a href="#gantt-tool">甘特图生成</a></li>
      <li><a href="#mindmap-tool">思维导图生成</a></li>
      <li><a href="#about">关于希格玛</a></li>
    </ul>
  </header>

  <main id="hero" class="hero-section">
    <div class="hero-background"></div>
    <div class="hero-overlay"></div>
    <h1>希格玛智能工具平台</h1>
    <p>集成工作计划可视化、资料整理与AI问答，将繁琐化为简单，让创意清晰可见。</p>
    <a href="#gantt-tool" class="cta-button">立即体验</a>
  </main>

  <div class="tools-section-container">
    <section id="gantt-tool" class="feature-card">
      <h2>📊 工作计划可视化</h2>
      <p class="feature-desc">输入您的工作计划，点击按钮即可生成甘特图或流程图。</p>
      <div class="feature-actions">
        <textarea placeholder="例如：3月1日-3月5日：需求调研；3月6日-3月15日：开发..."></textarea>
        <div style="display: flex; gap: 1rem; margin-top: 1rem;">
          <button id="generate-gantt">生成甘特图</button>
          <button id="generate-flow">生成流程图</button>
        </div>
        <div class="result-display" id="gantt-result"></div>
      </div>
    </section>

    <section id="mindmap-tool" class="feature-card">
      <h2>📋 资料智能整理</h2>
      <p class="feature-desc">粘贴多份资料内容，生成结构化思维导图或Excel表格。</p>
      <div class="feature-actions">
        <textarea placeholder="例如：项目需求文档、会议纪要、数据清单..."></textarea>
        <div style="display: flex; gap: 1rem; margin-top: 1rem;">
          <button id="generate-mindmap">生成思维导图</button>
          <button id="generate-excel">生成Excel</button>
        </div>
        <div class="result-display" id="mindmap-result"></div>
      </div>
    </section>

    <section id="about" class="feature-card">
        <h2>🚀 关于希格玛</h2>
        <p class="feature-desc">希格玛智能工具平台致力于利用前沿AI技术，为个人和团队提供高效、智能的办公解决方案。我们相信，强大的工具能够解放生产力，让您更专注于核心的创造性工作。</p>
    </section>
  </div>

  <script>
    // 初始化Coze聊天客户端
    new CozeWebSDK.WebChatClient({
      config: {
        type: 'bot',
        bot_id: '7545015693985611786',
        isIframe: false,
      },
      auth: {
        type: 'token',
        token: 'pat_yQpNz6FjtN04IgfeSbTnJ9r8qCyN39mXbuwtG1DahbTjMJAPuGF5UdSSP6qXWsDB',
        onRefreshToken: async () => 'token' // 实际项目需替换为真实的token刷新逻辑
      },
      userInfo: {
        id: 'user',
        url: 'https://lf-coze-web-cdn.coze.cn/obj/eden-cn/lm-lgvj/ljhwZthlaukjlkulzlp/coze/coze-logo.png',
        nickname: 'User',
      },
      ui: {
        base: {
          icon: 'https://lf-coze-web-cdn.coze.cn/obj/eden-cn/lm-lgvj/ljhwZthlaukjlkulzlp/coze/chatsdk-logo.png',
          layout: 'pc',
          lang: 'zh-CN',
          zIndex: 1001
        },
        header: { isShow: true, isNeedClose: true },
          conversations: { isNeed: true},
        asstBtn: { isNeed: true, style: { width: '60px', height: '60px', borderRadius: '50%' }},
        footer: { isShow: true, expressionText: 'Powered by Coze' },
        chatBot: { title: '希格玛智能问答机器人', uploadable: true, width: 390 },
      },
    });

    // 为按钮添加简单的点击事件
    document.querySelectorAll('.feature-actions button').forEach(button => {
      button.addEventListener('click', function() {
        const resultDisplay = this.closest('.feature-actions').querySelector('.result-display');
        resultDisplay.classList.add('active');
        resultDisplay.innerHTML = '<p>正在生成，请稍候...</p>';

        setTimeout(() => {
          // 示例结果
          resultDisplay.innerHTML = `<p>✅ ${this.textContent}已完成！</p><p>（这里将展示预览或下载链接）</p>`;
        }, 1500);
      });
    });
  </script>
</body>
</html>
