<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能政策对比分析工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx-populate@1.21.0/browser/xlsx-populate.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }

        /* 统一所有核心内容区的最大宽度和居中对齐 */
        .core-content {
            max-width: 4xl;
            margin-left: auto;
            margin-right: auto;
            padding-left: 1rem;
            padding-right: 1rem;
        }

        /* 两栏布局优化 */
        .two-col-grid {
            display: grid;
            grid-template-columns: 1fr; /* 移动端默认1栏 */
            gap: 2rem; /* 两栏间距 */
        }

        @media (min-width: 1024px) {
            .two-col-grid {
                grid-template-columns: repeat(2, 1fr); /* 桌面端两栏 */
            }
        }

        /* 统一卡片样式 */
        .unified-card {
            background-color: white;
            border-radius: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 1.5rem;
            transition: all 0.3s ease;
        }

        .unified-card:hover {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            transform: translateY(-2px);
        }

        /* 加载动画 */
        .loader, .mini-loader {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            animation: spin 1.5s linear infinite;
        }
        .loader { width: 50px; height: 50px; }
        .mini-loader { width: 30px; height: 30px; border-width: 3px; margin: 2rem auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* 动画效果 */
        .result-card, .search-results-card {
            transition: all 0.3s ease-in-out;
            opacity: 0;
            transform: translateY(20px);
        }
        .result-card.visible, .search-results-card.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* 搜索结果项 */
        .search-result-item:hover {
            background-color: #f9fafb;
        }

        /* 图表容器 */
        .chart-container {
            width: 100%;
            min-height: 400px;
            max-height: 80vh;
            overflow: auto;
        }

        /* 解决全屏背景变黑的问题 */
        .chart-container:fullscreen,
        .comparison-wrapper:fullscreen {
            background-color: white;
            padding: 1rem; /* 全屏时增加一些边距 */
            overflow: auto;
        }

        /* 图表工具按钮 */
        .card-actions {
            display: flex;
            gap: 0.5rem;
            z-index: 10;
        }
        .card-action-btn {
            background-color: rgba(229, 231, 235, 0.8); /* 半透明背景 */
            backdrop-filter: blur(4px);
            border: 1px solid rgba(209, 213, 219, 0.5);
            border-radius: 6px;
            padding: 0.25rem 0.5rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .card-action-btn:hover {
            background-color: #d1d5db;
        }
        .card-action-btn svg {
            width: 1rem;
            height: 1rem;
            color: #4b5563;
        }

        /* 标题样式 */
        .page-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 1rem;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 0.75rem;
        }

        .section-title {
            font-size: 1rem;
            font-weight: 600;
            color: #4b5563;
            margin-bottom: 0.5rem;
        }

        /* 分隔线 */
        .divider {
            height: 1px;
            background-color: #e5e7eb;
            margin: 2rem 0;
        }

        /* 按钮样式 */
        .btn-primary {
            background-color: #3498db;
            color: white;
            font-weight: 600;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            transition: background-color 0.2s;
        }

        .btn-primary:hover {
            background-color: #2563eb;
        }

        /* 移动端适配 */
        @media (max-width: 640px) {
            .card-actions {
                flex-wrap: wrap;
            }

            .chart-container {
                min-height: 300px;
            }

            .page-title {
                font-size: 1.5rem;
            }

            .card-title {
                font-size: 1.125rem;
            }
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">
    <header class="text-center py-8 mb-6 core-content">
        <h1 class="text-4xl md:text-5xl font-extrabold text-gray-900 mb-3">智能政策对比分析工具</h1>
        <p class="text-lg text-gray-600">利用AI大模型，快速洞察政策文件间的异同。</p>
    </header>

    <div class="core-content mb-8">
        <div class="unified-card">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label for="website-select" class="block text-sm font-medium text-gray-700 mb-2">选择网站来源</label>
                    <select id="website-select" class="w-full p-3 border border-gray-300 rounded-xl">
                        <option value="shaanxi">陕西省政府</option>
                        <option value="sasac">政府信息公开目录 (国资委)</option>
                        <option value="mot">中华人民共和国交通运输部</option>
                    </select>
                </div>
                <div>
                    <label for="keyword-input" class="block text-sm font-medium text-gray-700 mb-2">输入关键词</label>
                    <input type="text" id="keyword-input" placeholder="例如：投资管理办法" class="w-full p-3 border border-gray-300 rounded-xl">
                </div>
            </div>
            <div class="mt-4">
                <button id="searchButton" class="btn-primary w-full text-lg">搜索政策文件</button>
            </div>
        </div>
    </div>

    <div id="search-results-section" class="core-content mb-8 hidden">
         <div class="unified-card search-results-card">
            <h2 class="page-title">第二步：选择要对比的文件</h2>
            <div id="search-results-list" class="space-y-2 max-h-96 overflow-y-auto pr-2"></div>
            <div class="mt-6 text-center">
                <button id="compareButton" class="btn-primary w-full md:w-auto disabled:bg-gray-400" disabled>对比已选两项</button>
            </div>
         </div>
    </div>

    <div class="divider core-content"></div>

    <div id="loading" class="text-center my-10 hidden core-content"></div>

    <div id="error-display" class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 rounded-lg hidden" role="alert"></div>

    <div id="analysis-results-container" class="core-content space-y-8 pb-12"></div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // DOM 元素引用
    const websiteSelect = document.getElementById('website-select');
    const keywordInput = document.getElementById('keyword-input');
    const searchButton = document.getElementById('searchButton');
    const searchResultsSection = document.getElementById('search-results-section');
    const searchResultsList = document.getElementById('search-results-list');
    const compareButton = document.getElementById('compareButton');
    const loadingDiv = document.getElementById('loading');
    const errorDisplay = document.getElementById('error-display');
    const analysisResultsContainer = document.getElementById('analysis-results-container');

    // [ADDED] 新增：关键词建议功能
    const placeholderMap = {
        'shaanxi': '投资管理办法',
        'sasac': '中央企业违规经营投资责任追究',
        'mot': '政府和社会资本合作'
    };

    function updateKeywordPlaceholder() {
        const selectedWebsite = websiteSelect.value;
        keywordInput.placeholder = `例如：${placeholderMap[selectedWebsite] || '请输入关键词'}`;
    }

    // 添加事件监听
    websiteSelect.addEventListener('change', updateKeywordPlaceholder);

    // 页面加载时初始化
    updateKeywordPlaceholder();
    // [END ADDED]

    compareButton.addEventListener('click', async () => {
    const selectedDocs = getSelectedDocuments();
    if (selectedDocs.length !== 2) return;

    window._latestAnalysisData = {
        document1: { title: selectedDocs[0].title },
        document2: { title: selectedDocs[1].title },
        comparison: []
    };

    setLoadingState(true, "正在分析文件...");
    analysisResultsContainer.innerHTML = '';
    displayAnalysisSkeleton(selectedDocs[0].title, selectedDocs[1].title);

    try {
        updateLoadingMessage(`正在提取文件一 (${selectedDocs[0].title}) 的摘要与大纲...`);
        const doc1Res = await fetch('http://localhost:5000/api/analyze-document', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ doc_url: selectedDocs[0].url })
        });
        const doc1Data = await doc1Res.json();
        if (!doc1Res.ok) throw new Error(`文件一分析失败: ${doc1Data.error}`);
        window._latestAnalysisData.document1 = { ...window._latestAnalysisData.document1, ...doc1Data };
        renderDocumentData('doc1', window._latestAnalysisData.document1);

        updateLoadingMessage(`正在提取文件二 (${selectedDocs[1].title}) 的摘要与大纲...`);
        const doc2Res = await fetch('http://localhost:5000/api/analyze-document', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ doc_url: selectedDocs[1].url })
        });
        const doc2Data = await doc2Res.json();
        if (!doc2Res.ok) throw new Error(`文件二分析失败: ${doc2Data.error}`);
        window._latestAnalysisData.document2 = { ...window._latestAnalysisData.document2, ...doc2Data };
        renderDocumentData('doc2', window._latestAnalysisData.document2);

        updateLoadingMessage("正在生成对比表格...");
        const summary1 = doc1Data.summary || "";
        const summary2 = doc2Data.summary || "";

        const compRes = await fetch('http://localhost:5000/api/compare-summaries', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ summary1, summary2 })
        });
        const comparisonData = await compRes.json();

        if(compRes.ok) {
            window._latestAnalysisData.comparison = comparisonData.comparison;
            renderComparisonData(comparisonData.comparison);
        } else {
            console.error("对比分析失败:", comparisonData.error);
            renderComparisonData(null);
        }
        addCardActionListeners();
    } catch (error)
    {
        showError(error.message);
    } finally {
        setLoadingState(false);
    }
});

    function displayAnalysisSkeleton(title1 = '文件一', title2 = '文件二') {
        analysisResultsContainer.innerHTML = `
            <div class="two-col-grid">
                ${createDocumentCardSkeleton(title1, 'doc1')}
                ${createDocumentCardSkeleton(title2, 'doc2')}
            </div>
            <div id="comparison-container" class="mt-8">
                ${createComparisonCardSkeleton()}
            </div>
        `;
        document.querySelectorAll('.result-card').forEach((card, index) => {
            setTimeout(() => card.classList.add('visible'), index * 100);
        });
    }


    function addCardActionListeners() {
        const fullscreenSVG = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3.75v4.5m0-4.5h4.5m-4.5 0L9 9M3.75 20.25v-4.5m0 4.5h4.5m-4.5 0L9 15M20.25 3.75h-4.5m4.5 0v4.5m0-4.5L15 9m5.25 11.25h-4.5m4.5 0v-4.5m0 4.5L15 15" /></svg>`;
        const downloadExcelSVG = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3" /></svg>`;
        const downloadMarkdownSVG = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" /></svg>`;

        document.querySelectorAll('.card-actions').forEach(actionsContainer => {
            actionsContainer.innerHTML = '';

            const targetId = actionsContainer.dataset.target;
            const targetElement = document.getElementById(targetId);

            const fsBtn = document.createElement('button');
            fsBtn.className = 'card-action-btn';
            fsBtn.title = '全屏查看';
            fsBtn.innerHTML = fullscreenSVG;
            fsBtn.onclick = () => { if (targetElement && targetElement.requestFullscreen) targetElement.requestFullscreen(); };
            actionsContainer.appendChild(fsBtn);

            if (actionsContainer.dataset.type === 'comparison') {
                const dlBtn = document.createElement('button');
                dlBtn.className = 'card-action-btn';
                dlBtn.title = '下载为Excel文件';
                dlBtn.innerHTML = downloadExcelSVG;
                dlBtn.onclick = () => { downloadComparisonAsExcel(_latestAnalysisData.comparison); };
                actionsContainer.appendChild(dlBtn);
            }

            if (actionsContainer.dataset.type === 'chart') {
                const docKey = targetId.includes('doc1') ? 'document1' : 'document2';
                const dlMdBtn = document.createElement('button');
                dlMdBtn.className = 'card-action-btn';
                dlMdBtn.title = '下载大纲 (Markdown)';
                dlMdBtn.innerHTML = downloadMarkdownSVG;
                dlMdBtn.onclick = () => {
                    if (_latestAnalysisData && _latestAnalysisData[docKey]) {
                        const filename = `${_latestAnalysisData[docKey].title}_大纲.md` || `${docKey}_大纲.md`;
                        downloadOutlineAsMarkdown(_latestAnalysisData[docKey].outline, filename);
                    }
                };
                actionsContainer.appendChild(dlMdBtn);
            }
        });
    }

    function downloadOutlineAsMarkdown(outlineData, filename) {
        if (!outlineData || !Array.isArray(outlineData) || outlineData.length === 0) {
            alert("没有可供下载的大纲数据。");
            return;
        }
        function toMarkdown(nodes, depth = 0) {
            let markdown = '';
            const indent = '  '.repeat(depth);
            nodes.forEach(node => {
                markdown += `${indent}- ${node.name}\n`;
                if (node.children && node.children.length > 0) {
                    markdown += toMarkdown(node.children, depth + 1);
                }
            });
            return markdown;
        }
        const markdownContent = toMarkdown(outlineData);
        const blob = new Blob([markdownContent], { type: 'text/markdown;charset=utf-8' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        a.click();
        window.URL.revokeObjectURL(url);
    }

    async function downloadComparisonAsExcel(comparisonData) {
        if (!comparisonData || !Array.isArray(comparisonData) || comparisonData.length === 0) {
            alert("没有可供下载的对比数据。");
            return;
        }
        try {
            const workbook = await XlsxPopulate.fromBlankAsync();
            const sheet = workbook.sheet(0).name("政策对比分析");

            const title1 = window._latestAnalysisData.document1.title || '文件一';
            const title2 = window._latestAnalysisData.document2.title || '文件二';

            sheet.cell("A1").value("对比维度").style({bold: true, fill: "D9EAD3"});
            sheet.cell("B1").value(title1).style({bold: true, fill: "D9EAD3"});
            sheet.cell("C1").value(title2).style({bold: true, fill: "D9EAD3"});

            comparisonData.forEach((item, index) => {
                const row = index + 2;
                sheet.cell(`A${row}`).value(item.dimension || "");
                sheet.cell(`B${row}`).value(item.document1_point || "").style({wrapText: true});
                sheet.cell(`C${row}`).value(item.document2_point || "").style({wrapText: true});
            });
            sheet.column("A").width(25);
            sheet.column("B").width(60);
            sheet.column("C").width(60);
            const blob = await workbook.outputAsync();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "政策对比分析.xlsx";
            a.click();
            window.URL.revokeObjectURL(url);
        } catch (error) {
            console.error("生成Excel失败:", error);
            alert("生成可编辑的Excel文件失败，请检查控制台。");
        }
    }

    function renderDocumentData(id_prefix, docData) {
        const cardElement = document.getElementById(`outline-chart-${id_prefix}`).closest('.unified-card');
        const summaryContainer = document.getElementById(`summary-${id_prefix}`);

        if(cardElement && docData.title) {
            const titleElement = cardElement.querySelector('.card-title');
            if (titleElement) titleElement.textContent = docData.title;
        }

        if(summaryContainer) {
            summaryContainer.innerHTML = `
                <p><strong>发文日期:</strong> ${docData.publish_date || '未提取'}</p>
                <p><strong>发文机构:</strong> ${docData.agency || '未提取'}</p>
                <div>
                    <strong class="block mb-1">主要内容摘要:</strong>
                    <p class="text-gray-600 leading-relaxed">${docData.summary || '未提取'}</p>
                </div>
            `;
        }
        renderOutlineChart(`outline-chart-${id_prefix}`, docData.outline);
    }


    function renderComparisonData(comparisonData) {
        const container = document.getElementById('comparison-container');
        if(container) {
            container.innerHTML = createComparisonCard(comparisonData);
            setTimeout(() => container.querySelector('.result-card')?.classList.add('visible'), 50);
        }
    }

    function createDocumentCardSkeleton(title, id_prefix) {
        return `<div class="unified-card result-card space-y-6">
            <div>
                <h2 class="card-title">${title}</h2>
            </div>
            <div class="space-y-3 text-gray-700" id="summary-${id_prefix}">
                <div class="mini-loader"></div>
            </div>
            <div>
                <h3 class="section-title">文件大纲 (思维导图)</h3>
                <div class="relative border rounded-lg">
                    <div id="outline-chart-${id_prefix}" class="chart-container flex items-center justify-center">
                        <div class="mini-loader"></div>
                    </div>
                    <div class="card-actions absolute top-2 right-2" data-type="chart" data-target="outline-chart-${id_prefix}"></div>
                </div>
            </div>
        </div>`;
    }

    function createComparisonCardSkeleton() {
        return `<div class="unified-card result-card">
            <h2 class="card-title text-indigo-700">🔍 两份文件主要区别点</h2>
            <div class="mini-loader"></div>
        </div>`;
    }

    searchButton.addEventListener('click', async () => {
        const website = websiteSelect.value;
        const keyword = keywordInput.value.trim();
        if (!keyword) {
            showError("请输入关键词进行搜索。");
            return;
        }
        setLoadingState(true, "正在搜索，请稍候...");
        searchResultsSection.classList.add('hidden');
        analysisResultsContainer.innerHTML = '';
        try {
            const response = await fetch('http://localhost:5000/api/search', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ website, keyword })
            });
            const results = await response.json();
            if (!response.ok) throw new Error(results.error || "搜索失败");
            displaySearchResults(results);
        } catch (error) {
            showError(error.message);
        } finally {
            setLoadingState(false);
        }
    });

    function displaySearchResults(results) {
        searchResultsList.innerHTML = '';
        if (results.length === 0) {
            searchResultsList.innerHTML = '<p class="text-gray-500">未找到相关结果，请尝试其他关键词。</p>';
        } else {
            results.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'p-3 border rounded-lg cursor-pointer search-result-item flex items-start space-x-3';
                div.innerHTML = `
                    <input type="checkbox" id="res-${index}" value="${item.url}" data-title="${item.title}"
                        class="mt-1 h-5 w-5 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                    <label for="res-${index}" class="flex-1">
                        <span class="font-medium text-gray-800">${item.title}</span>
                        <span class="block text-xs text-gray-500 mt-1">${item.url}</span>
                    </label>
                `;
                div.querySelector('input[type="checkbox"]').addEventListener('change', updateCompareButtonState);
                searchResultsList.appendChild(div);
            });
        }
        searchResultsSection.classList.remove('hidden');
        setTimeout(() => searchResultsSection.querySelector('.search-results-card').classList.add('visible'), 50);
        updateCompareButtonState();
    }

    function updateCompareButtonState() {
        const selectedCount = getSelectedDocuments().length;
        compareButton.disabled = (selectedCount !== 2);
        if (selectedCount === 2) {
            compareButton.textContent = "对比已选两项";
        } else {
            compareButton.textContent = `请选择两项 (${selectedCount}/2)`;
        }
    }

    function getSelectedDocuments() {
        return Array.from(searchResultsList.querySelectorAll('input[type="checkbox"]:checked'))
            .map(cb => ({
                url: cb.value,
                title: cb.dataset.title
            }));
    }

    function setLoadingState(isLoading, message = "") {
        if (isLoading) {
            loadingDiv.innerHTML = `
                <div class="loader mx-auto"></div>
                <p class="mt-4 text-blue-600 font-semibold text-lg">${message}</p>
            `;
            loadingDiv.classList.remove('hidden');
            searchButton.disabled = true;
            compareButton.disabled = true;
        } else {
            loadingDiv.classList.add('hidden');
            searchButton.disabled = false;
            updateCompareButtonState();
        }
        errorDisplay.classList.add('hidden');
    }

    function showError(message) {
        errorDisplay.innerHTML = `
            <p class="font-bold">发生错误</p>
            <p>${message}</p>
        `;
        errorDisplay.classList.remove('hidden');
    }

    function createComparisonCard(comparisonData) {
        if (!comparisonData || !Array.isArray(comparisonData) || comparisonData.length === 0) {
            return `<div class="unified-card result-card">
                <h2 class="card-title text-indigo-700">🔍 两份文件主要区别点</h2>
                <p class="text-gray-500">未能提取到有效的对比信息。</p>
            </div>`;
        }

        const title1 = window._latestAnalysisData.document1.title || '文件一';
        const title2 = window._latestAnalysisData.document2.title || '文件二';

        let tableRows = comparisonData.map(item => `
            <tr class="border-b last:border-b-0">
                <td class="p-4 align-top font-semibold text-gray-800 w-1/5 bg-gray-50">
                    ${item.dimension || '对比维度'}
                </td>
                <td class="p-4 align-top text-gray-600">${item.document1_point || '无'}</td>
                <td class="p-4 align-top text-gray-600">${item.document2_point || '无'}</td>
            </tr>
        `).join('');
        return `<div class="unified-card result-card">
            <h2 class="card-title text-indigo-700">🔍 两份文件主要区别点</h2>
            <div class="relative comparison-wrapper" id="comparison-card">
                 <div class="card-actions absolute -top-10 right-0" data-type="comparison" data-target="comparison-card"></div>
                <div class="overflow-x-auto border rounded-lg">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-gray-100">
                            <tr class="border-b">
                                <th class="p-4 font-semibold text-gray-700">对比维度</th>
                                <th class="p-4 font-semibold text-gray-700">${title1}</th>
                                <th class="p-4 font-semibold text-gray-700">${title2}</th>
                            </tr>
                        </thead>
                        <tbody>${tableRows}</tbody>
                    </table>
                </div>
            </div>
        </div>`;
    }

    function renderOutlineChart(containerId, data) {
        const chartDom = document.getElementById(containerId);
        if (!chartDom || !data || data.length === 0) {
            if(chartDom) chartDom.innerHTML = `
                <div class="flex items-center justify-center h-full text-gray-500">
                    未能提取到有效大纲数据。
                </div>
            `;
            return;
        };

        chartDom.style.width = '';
        chartDom.style.height = '';

        echarts.dispose(chartDom);
        const myChart = echarts.init(chartDom);

        const option = {
            roam: true,
            tooltip: {
                trigger: 'item',
                triggerOn: 'mousemove',
                formatter: (params) => `<div style="max-width: 300px; white-space: normal;">${params.name}</div>`
            },
            series: [{
                type: 'tree',
                data: [{ name: '文件大纲', children: data }],
                orient: 'LR',
                left: '8%',
                right: '20%',
                top: '5%',
                bottom: '5%',
                itemGap: 20,
                initialTreeDepth: 1,
                expandAndCollapse: true,
                symbol: 'circle',
                symbolSize: 8,
                label: {
                    fontSize: 13,
                    width: 160,
                    overflow: 'truncate',
                    verticalAlign: 'middle',
                    align: 'left',
                    position: 'right',
                    distance: 10
                },
                lineStyle: {
                    width: 1.2,
                    color: '#ccc',
                },
                leaves: {
                    label: {
                        position: 'right',
                        align: 'left'
                    }
                },
                emphasis: {
                    focus: 'descendant',
                    itemStyle: {
                        borderColor: '#3498db'
                    },
                    lineStyle: {
                        color: '#3498db'
                    }
                },
                animationDuration: 300,
                animationDurationUpdate: 500
            }]
        };

        myChart.setOption(option);
        window.addEventListener('resize', () => myChart.resize());

        const resetBtnContainer = chartDom.parentElement;
        const existingResetBtn = resetBtnContainer.querySelector('.reset-chart-btn');
        if (existingResetBtn) existingResetBtn.remove();

        const resetBtn = document.createElement('button');
        resetBtn.className = 'reset-chart-btn absolute bottom-2 left-2 z-10 px-3 py-1 bg-gray-100 hover:bg-gray-200 rounded text-sm text-gray-700';
        resetBtn.textContent = '重置视图';
        resetBtn.onclick = () => myChart.dispatchAction({ type: 'restore' });
        resetBtnContainer.appendChild(resetBtn);
    }

    function updateLoadingMessage(message) {
        const p = loadingDiv.querySelector('p');
        if (p) p.textContent = message;
    }
});
</script>

</body>
</html>
