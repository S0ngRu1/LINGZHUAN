<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目计划甘特图生成器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/xlsx-populate/browser/xlsx-populate.min.js"></script>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .editable-table td, .editable-table th {
            padding: 8px 12px;
            border: 1px solid #e2e8f0;
        }
        .editable-table th {
            background-color: #f8fafc;
        }
        .editable-table [contenteditable="true"]:focus {
            outline: 2px solid #3b82f6;
            background-color: #eff6ff;
        }
        /* Styles for the high-fidelity Gantt Chart Visualization */
        .gantt-container {
            display: grid;
            border-top: 1px solid #cbd5e1;
            border-left: 1px solid #cbd5e1;
        }
        .gantt-cell {
            border-right: 1px solid #cbd5e1;
            border-bottom: 1px solid #cbd5e1;
            padding: 8px;
            font-size: 0.875rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .gantt-header {
            background-color: #f1f5f9;
            font-weight: 600;
            text-align: center;
        }
        .gantt-phase {
            font-weight: 600;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .gantt-task {
             display: flex;
            align-items: center;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <div class="container mx-auto p-4 md:p-8 max-w-7xl">
        <header class="text-center mb-8">
            <h1 class="text-3xl md:text-4xl font-bold text-gray-900">项目计划甘特图在线生成器</h1>
            <p class="mt-2 text-md text-gray-600">上传项目计划文件，在线编辑任务，一键生成精美的Excel甘特图。</p>
        </header>

        <div class="bg-white p-6 rounded-xl shadow-md mb-8">
            <h2 class="text-xl font-semibold mb-4 border-b pb-2">第一步：上传并解析文件</h2>
            <div class="flex flex-col sm:flex-row items-center gap-4">
                <input type="file" id="fileInput" class="block w-full text-sm text-gray-500
                    file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold
                    file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 transition-colors duration-200 cursor-pointer"/>
                <button id="parseButton" class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg transition-transform duration-200 active:scale-95">
                    解析文件内容
                </button>
            </div>
            <div id="loading" class="mt-4 items-center gap-3 hidden">
                <div class="loader"></div>
                <span class="text-blue-600 font-medium">解析中，请稍候... </span>
            </div>
            <p id="fileError" class="text-red-500 mt-2 text-sm hidden"></p>
        </div>

        <div class="bg-white p-6 rounded-xl shadow-md mb-8">
            <h2 class="text-xl font-semibold mb-4 border-b pb-2">第二步：在线编辑任务计划</h2>
             <div class="overflow-x-auto">
                <table id="dataTable" class="min-w-full bg-white border-collapse editable-table">
                    <thead>
                        <tr class="text-left text-gray-600 font-semibold">
                            <th style="width: 14%;">阶段</th>
                            <th style="width: 25%;">工作子项</th>
                            <th style="width: 18%;">成果文件</th>
                            <th style="width: 15%;">主责单位/负责人</th>
                            <th style="width: 12%;">开始日期</th>
                            <th style="width: 12%;">结束日期</th>
                            <th style="min-width: 110px;" class="text-center">操作</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

        <div id="visualization-section" class="bg-white p-6 rounded-xl shadow-md mb-8 hidden">
            <h2 class="text-xl font-semibold mb-4 border-b pb-2">第三步：在线预览</h2>
            <div id="gantt-chart-container" class="overflow-x-auto"></div>
        </div>

        <div class="bg-white p-6 rounded-xl shadow-md">
            <h2 class="text-xl font-semibold mb-4 border-b pb-2">第四步：生成与下载</h2>
            <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
                <button id="previewButton" class="w-full sm:w-auto bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 px-8 rounded-lg text-lg transition-transform duration-200 active:scale-95 disabled:bg-gray-400 disabled:cursor-not-allowed" disabled>
                    在线预览甘特图
                </button>
                <button id="downloadButton" class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-8 rounded-lg text-lg transition-transform duration-200 active:scale-95 disabled:bg-gray-400 disabled:cursor-not-allowed" disabled>
                    下载Excel文件
                </button>
            </div>
             <div id="generating" class="mt-4 justify-center items-center gap-3 hidden">
                <div class="loader"></div>
                <span class="text-indigo-600 font-medium">处理中...</span>
            </div>
        </div>
    </div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // DOM Element References
    const fileInput = document.getElementById('fileInput');
    const parseButton = document.getElementById('parseButton');
    const previewButton = document.getElementById('previewButton');
    const downloadButton = document.getElementById('downloadButton');
    const dataTableBody = document.querySelector('#dataTable tbody');
    const loadingDiv = document.getElementById('loading');
    const generatingDiv = document.getElementById('generating');
    const fileError = document.getElementById('fileError');
    const visualizationSection = document.getElementById('visualization-section');
    const ganttChartContainer = document.getElementById('gantt-chart-container');

    // Event Listeners
    parseButton.addEventListener('click', async () => {
        const file = fileInput.files[0];
        if (!file) {
            fileError.textContent = '请先选择一个文件。';
            fileError.classList.remove('hidden');
            return;
        }
        loadingDiv.style.display = 'flex';
        fileError.classList.add('hidden');
        dataTableBody.innerHTML = '';
        previewButton.disabled = true;
        downloadButton.disabled = true;

        const formData = new FormData();
        formData.append('file', file);

        try {
            const response = await fetch('http://127.0.0.1:5000/api/parse-file', {
                method: 'POST',
                body: formData,
            });
            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.error || `HTTP 错误! 状态: ${response.status}`);
            }
            const parsedData = await response.json();
            populateTable(parsedData);
            previewButton.disabled = false;
        } catch (error) {
            console.error("解析文件时出错:", error);
            fileError.textContent = `解析失败: ${error.message}`;
            fileError.classList.remove('hidden');
        } finally {
            loadingDiv.style.display = 'none';
        }
    });

    previewButton.addEventListener('click', () => {
        generatingDiv.style.display = 'flex';
        previewButton.disabled = true;
        try {
            const tableData = getTableData();
            if (tableData.length === 0) {
                 alert("表格中没有数据，无法预览。");
                 return;
            }
            renderGanttChartVisualization(tableData);
            downloadButton.disabled = false;
        } catch (error) {
            console.error("预览生成失败:", error);
            alert("生成预览时发生错误，请检查控制台。");
        } finally {
            generatingDiv.style.display = 'none';
            previewButton.disabled = false;
        }
    });

    // --- 全新修改：下载按钮现在调用后端API ---
    downloadButton.addEventListener('click', async () => {
        generatingDiv.style.display = 'flex';
        downloadButton.disabled = true;
        try {
            // 1. 获取在线编辑后的最新数据
            const tableData = getTableData();
            if (tableData.length === 0) {
                alert("表格中没有数据，无法下载。");
                return;
            }

            // 2. 向新的后端接口发送POST请求，并携带JSON数据
            const response = await fetch('http://127.0.0.1:5000/api/generate-excel', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(tableData),
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.error || `HTTP 错误! 状态: ${response.status}`);
            }

            // 3. 处理后端返回的文件流，触发浏览器下载
            const blob = await response.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            document.body.appendChild(a);
            a.style.display = 'none';
            a.href = url;

            // 从响应头中智能获取后端生成的文件名
            const disposition = response.headers.get('Content-Disposition');
            let filename = '项目计划甘特图.xlsx'; // 默认文件名
            if (disposition && disposition.indexOf('attachment') !== -1) {
                const filenameRegex = /filename[^;=\n]*=((['"]).*?\2|[^;\n]*)/;
                const matches = filenameRegex.exec(disposition);
                if (matches != null && matches[1]) {
                    filename = decodeURIComponent(matches[1].replace(/['"]/g, ''));
                }
            }
            a.download = filename;

            a.click();
            window.URL.revokeObjectURL(url);
            document.body.removeChild(a);

        } catch (error) {
            console.error("下载失败:", error);
            alert(`下载Excel文件时发生错误: ${error.message}`);
        } finally {
            generatingDiv.style.display = 'none';
            downloadButton.disabled = false;
        }
    });

    // --- Table Manipulation ---
    function populateTable(data) {
        dataTableBody.innerHTML = '';
        const tableData = Array.isArray(data) ? data : [];
        if (tableData.length === 0) {
            const newRow = createRow({"阶段": "", "工作子项": "", "成果文件": "", "主责单位/负责人": "", "开始日期": "", "结束日期": ""});
            dataTableBody.appendChild(newRow);
        } else {
            tableData.forEach(item => {
                const newRow = createRow(item);
                dataTableBody.appendChild(newRow);
            });
        }
    }


    function createRow(item) {
        const row = document.createElement('tr');
        const task = item || {};
        const buttonClasses = "text-white text-xs font-bold py-1 px-2 rounded transition-transform duration-150 active:scale-90 mx-1";

        row.innerHTML = `
            <td contenteditable="true" data-key="阶段">${task.阶段 || ''}</td>
            <td contenteditable="true" data-key="工作子项">${task.工作子项 || ''}</td>
            <td contenteditable="true" data-key="成果文件">${task.成果文件 || ''}</td>
            <td contenteditable="true" data-key="主责单位/负责人">${task['主责单位/负责人'] || ''}</td>
            <td contenteditable="true" data-key="开始日期">${task.开始日期 || ''}</td>
            <td contenteditable="true" data-key="结束日期">${task.结束日期 || ''}</td>
            <td class="text-center">
                <div class="flex justify-center items-center space-x-2">
                    <button class="add-row bg-green-500 hover:bg-green-600 ${buttonClasses}" title="在此行后添加新任务">+</button>
                    <button class="delete-row bg-red-500 hover:bg-red-600 ${buttonClasses}" title="删除此行">-</button>
                </div>
            </td>
        `;

        row.querySelector('.add-row').addEventListener('click', () => {
            const newRowData = {
                "阶段": task.阶段,
                "工作子项": "新任务",
                "成果文件": "",
                "主责单位/负责人": task['主责单位/负责人'],
                "开始日期": "",
                "结束日期": ""
            };
            const newTr = createRow(newRowData);
            row.insertAdjacentElement('afterend', newTr);
            updateButtonStates();
        });

        row.querySelector('.delete-row').addEventListener('click', () => {
            row.remove();
            updateButtonStates();
        });

        row.querySelectorAll('[contenteditable="true"]').forEach(cell => {
             cell.addEventListener('input', () => {
                updateButtonStates();
             });
        });

        return row;
    }

    function updateButtonStates() {
        previewButton.disabled = false;
        downloadButton.disabled = true;
        visualizationSection.classList.add('hidden');
    }

    function getTableData() {
        return Array.from(dataTableBody.querySelectorAll('tr')).map(row => {
            const cells = row.querySelectorAll('[contenteditable="true"]');
            const rowData = {};
            cells.forEach(cell => rowData[cell.dataset.key] = cell.textContent.trim());
            return rowData;
        });
    }

    function getValidatedData(workData) {
        const processedData = workData.map(d => {
            const startDate = new Date(d.开始日期);
            const endDate = new Date(d.结束日期);
            return {
                ...d,
                开始日期: !isNaN(startDate.getTime()) ? startDate : null,
                结束日期: !isNaN(endDate.getTime()) ? endDate : null
            };
        });

        const invalidTasks = processedData.filter(d => !d.开始日期 || !d.结束日期);
        if (invalidTasks.length > 0 && workData.length > 0) {
            const invalidTaskNames = invalidTasks.map(t => `"${t.工作子项}"`).join('、');
            console.warn(`提醒：任务 ${invalidTaskNames} 的日期格式不正确或为空，将仅显示任务信息。`);
        }
        if (processedData.length === 0) {
             alert("错误：没有可处理的任务数据。");
             throw new Error("No data for processing.");
        }
        return processedData;
    }

    const colors = ['B7DEE8', 'FCD5B4', 'C4D79B', 'D8BFD8', 'F0C2C2', 'FFFACD'];
    const lightColors = ['E8F5F8', 'FEF3E6', 'EFF5DA', 'F4ECF7', 'FBE9E7', 'FFFDE7'];

    function calculateCalendarDates(df) {
        const tasksWithDates = df.filter(d => d.开始日期 && d.结束日期);
        if (tasksWithDates.length === 0) {
            return [];
        }
        const allTimes = new Set();
        tasksWithDates.forEach(task => {
            allTimes.add(task.开始日期.getTime());
            allTimes.add(task.结束日期.getTime());
        });
        return Array.from(allTimes)
            .map(time => new Date(time))
            .sort((a, b) => a - b);
    }

    function renderGanttChartVisualization(workData) {
        const df = getValidatedData(workData);
        const calendarDates = calculateCalendarDates(df);
        const uniquePhases = [...new Set(df.map(d => d.阶段))];
        const phaseColorMap = uniquePhases.reduce((acc, phase, i) => ({ ...acc, [phase]: {
            task: colors[i % colors.length],
            info: lightColors[i % lightColors.length]
        }}), {});

        ganttChartContainer.innerHTML = '';
        const grid = document.createElement('div');
        grid.className = 'gantt-container';

        // --- 关键修改：动态计算日期列的宽度 ---
        // 找出最长的日期字符串来估算宽度
        const longestDate = "YYYY-MM-DD".length; // "2025/09/12" is 10 chars
        const dateColWidth = Math.max(90, longestDate * 9); // 最小90px
        grid.style.gridTemplateColumns = `150px 250px 200px 150px repeat(${calendarDates.length}, minmax(${dateColWidth}px, 1fr))`;

        let html = '';

        html += `<div class="gantt-cell gantt-header" style="grid-column: 1 / 5; grid-row: 1;"></div>`;
        if (calendarDates.length > 0) {
            html += `<div class="gantt-cell gantt-header" style="grid-column: 5 / ${5 + calendarDates.length}; grid-row: 1;">工作日</div>`;
        }
        html += `<div class="gantt-cell gantt-header" style="grid-column: 1; grid-row: 2;">阶段</div>`;
        html += `<div class="gantt-cell gantt-header" style="grid-column: 2; grid-row: 2;">工作子项</div>`;
        html += `<div class="gantt-cell gantt-header" style="grid-column: 3; grid-row: 2;">成果文件</div>`;
        html += `<div class="gantt-cell gantt-header" style="grid-column: 4; grid-row: 2;">主责单位/负责人</div>`;
        calendarDates.forEach((date, i) => {
            html += `<div class="gantt-cell gantt-header" style="grid-column: ${i + 5}; grid-row: 2;">${date.toLocaleDateString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit' })}</div>`;
        });

        df.forEach((task, i) => {
            const taskRow = i + 3;
            const phaseColors = phaseColorMap[task.阶段] || { info: 'FFFFFF', task: 'D9D9D9' };
            const infoColor = phaseColors.info;

            html += `<div class="gantt-cell gantt-phase" style="grid-column: 1; grid-row: ${taskRow}; background-color: #${infoColor};">${task.阶段 || ''}</div>`;
            html += `<div class="gantt-cell gantt-task" style="grid-column: 2; grid-row: ${taskRow}; background-color: #${infoColor};">${task.工作子项 || ''}</div>`;
            html += `<div class="gantt-cell" style="grid-column: 3; grid-row: ${taskRow}; background-color: #${infoColor};">${task.成果文件 || ''}</div>`;
            html += `<div class="gantt-cell" style="grid-column: 4; grid-row: ${taskRow}; background-color: #${infoColor};">${task['主责单位/负责人'] || ''}</div>`;

            calendarDates.forEach((calDate, j) => {
                let taskBarColor = '';
                if (task.开始日期 && task.结束日期 && calDate >= task.开始日期 && calDate <= task.结束日期) {
                    taskBarColor = `background-color: #${phaseColors.task};`;
                }
                html += `<div class="gantt-cell" style="grid-column: ${j + 5}; grid-row: ${taskRow}; ${taskBarColor}"></div>`;
            });
        });

        grid.innerHTML = html;
        ganttChartContainer.appendChild(grid);
        visualizationSection.classList.remove('hidden');
    }

});
</script>

</body>
</html>
