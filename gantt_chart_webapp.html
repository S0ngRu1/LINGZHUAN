<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目计划甘特图生成器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/xlsx-populate/browser/xlsx-populate.min.js"></script>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .editable-table td, .editable-table th {
            padding: 8px 12px;
            border: 1px solid #e2e8f0;
        }
        .editable-table th {
            background-color: #f8fafc;
        }
        .editable-table [contenteditable="true"]:focus {
            outline: 2px solid #3b82f6;
            background-color: #eff6ff;
        }
        /* Styles for the high-fidelity Gantt Chart Visualization */
        .gantt-container {
            display: grid;
            border-top: 1px solid #cbd5e1;
            border-left: 1px solid #cbd5e1;
        }
        .gantt-cell {
            border-right: 1px solid #cbd5e1;
            border-bottom: 1px solid #cbd5e1;
            padding: 8px;
            font-size: 0.875rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .gantt-header {
            background-color: #f1f5f9;
            font-weight: 600;
            text-align: center;
        }
        .gantt-phase {
            font-weight: 600;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .gantt-task {
             display: flex;
            align-items: center;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <div class="container mx-auto p-4 md:p-8 max-w-7xl">
        <header class="text-center mb-8">
            <h1 class="text-3xl md:text-4xl font-bold text-gray-900">项目计划甘特图在线生成器</h1>
            <p class="mt-2 text-md text-gray-600">上传项目计划文件，在线编辑任务，一键生成精美的Excel甘特图。</p>
        </header>

        <!-- Step 1: File Upload and Parsing -->
        <div class="bg-white p-6 rounded-xl shadow-md mb-8">
            <h2 class="text-xl font-semibold mb-4 border-b pb-2">第一步：上传并解析文件</h2>
            <div class="flex flex-col sm:flex-row items-center gap-4">
                <input type="file" id="fileInput" class="block w-full text-sm text-gray-500
                    file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold
                    file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 transition-colors duration-200 cursor-pointer"/>
                <button id="parseButton" class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg transition-transform duration-200 active:scale-95">
                    解析文件内容
                </button>
            </div>
            <div id="loading" class="mt-4 items-center gap-3 hidden">
                <div class="loader"></div>
                <span class="text-blue-600 font-medium">解析中，请稍候... (当前为模拟过程)</span>
            </div>
            <p id="fileError" class="text-red-500 mt-2 text-sm hidden"></p>
        </div>

        <!-- Step 2: Edit Data -->
        <div class="bg-white p-6 rounded-xl shadow-md mb-8">
            <h2 class="text-xl font-semibold mb-4 border-b pb-2">第二步：在线编辑任务计划</h2>
             <div class="overflow-x-auto">
                <table id="dataTable" class="min-w-full bg-white border-collapse editable-table">
                    <thead>
                        <tr class="text-left text-gray-600 font-semibold">
                            <th class="w-1/4">阶段</th>
                            <th class="w-2/4">工作子项</th>
                            <th class="w-1/6">开始日期 (YYYY-MM-DD)</th>
                            <th class="w-1/6">结束日期 (YYYY-MM-DD)</th>
                            <th class="w-auto text-center">操作</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
            <button id="addRowButton" class="mt-4 bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded-lg transition-transform duration-200 active:scale-95">
                + 添加新任务
            </button>
        </div>

        <!-- Step 3: Visualize Gantt Chart -->
        <div id="visualization-section" class="bg-white p-6 rounded-xl shadow-md mb-8 hidden">
            <h2 class="text-xl font-semibold mb-4 border-b pb-2">第三步：在线预览</h2>
            <div id="gantt-chart-container" class="overflow-x-auto"></div>
        </div>

        <!-- Step 4: Generate and Download -->
        <div class="bg-white p-6 rounded-xl shadow-md">
            <h2 class="text-xl font-semibold mb-4 border-b pb-2">第四步：生成与下载</h2>
            <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
                <button id="previewButton" class="w-full sm:w-auto bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 px-8 rounded-lg text-lg transition-transform duration-200 active:scale-95 disabled:bg-gray-400 disabled:cursor-not-allowed" disabled>
                    在线预览甘特图
                </button>
                <button id="downloadButton" class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-8 rounded-lg text-lg transition-transform duration-200 active:scale-95 disabled:bg-gray-400 disabled:cursor-not-allowed" disabled>
                    下载Excel文件
                </button>
            </div>
             <div id="generating" class="mt-4 justify-center items-center gap-3 hidden">
                <div class="loader"></div>
                <span class="text-indigo-600 font-medium">处理中...</span>
            </div>
        </div>
    </div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // DOM Element References
    const fileInput = document.getElementById('fileInput');
    const parseButton = document.getElementById('parseButton');
    const previewButton = document.getElementById('previewButton');
    const downloadButton = document.getElementById('downloadButton');
    const addRowButton = document.getElementById('addRowButton');
    const dataTableBody = document.querySelector('#dataTable tbody');
    const loadingDiv = document.getElementById('loading');
    const generatingDiv = document.getElementById('generating');
    const fileError = document.getElementById('fileError');
    const visualizationSection = document.getElementById('visualization-section');
    const ganttChartContainer = document.getElementById('gantt-chart-container');

    const mockData = [
        {"阶段": "项目启动", "工作子项": "需求分析与原型设计", "开始日期": "2025-10-01", "结束日期": "2025-10-05"},
        {"阶段": "项目启动", "工作子项": "成立项目小组", "开始日期": "2025-10-03", "结束日期": "2025-10-04"},
        {"阶段": "开发阶段", "工作子项": "前端UI开发", "开始日期": "2025-10-06", "结束日期": "2025-10-15"},
        {"阶段": "开发阶段", "工作子项": "后端API开发", "开始日期": "2025-10-08", "结束日期": "2025-10-20"},
        {"阶段": "测试阶段", "工作子项": "单元测试与集成测试", "开始日期": "2025-10-21", "结束日期": "2025-10-25"},
        {"阶段": "项目收尾", "工作子项": "部署上线", "开始日期": "2025-10-28", "结束日期": "2025-10-28"},
        {"阶段": "项目收尾", "工作子项": "编写用户手册", "开始日期": "2025-10-26", "结束日期": "2025-10-30"},
    ];

    // Event Listeners
    parseButton.addEventListener('click', () => {
        if (!fileInput.files[0]) {
            fileError.textContent = '请先选择一个文件。';
            fileError.classList.remove('hidden');
            return;
        }
        loadingDiv.style.display = 'flex';
        dataTableBody.innerHTML = '';
        previewButton.disabled = true;
        downloadButton.disabled = true;
        visualizationSection.classList.add('hidden');

        setTimeout(() => {
            populateTable(mockData);
            loadingDiv.style.display = 'none';
            previewButton.disabled = false;
        }, 1500);
    });

    addRowButton.addEventListener('click', () => {
        const newRowData = {"阶段": "新阶段", "工作子项": "新任务", "开始日期": "YYYY-MM-DD", "结束日期": "YYYY-MM-DD"};
        createRow(newRowData);
        previewButton.disabled = false;
        downloadButton.disabled = true; // Deactivate download button if table is edited
        visualizationSection.classList.add('hidden');
    });

    previewButton.addEventListener('click', () => {
        generatingDiv.style.display = 'flex';
        previewButton.disabled = true;
        try {
            const tableData = getTableData();
            if (tableData.length === 0) {
                 alert("表格中没有数据，无法预览。");
                 return;
            }
            renderGanttChartVisualization(tableData);
            downloadButton.disabled = false; // Enable download after successful preview
        } catch (error) {
            console.error("预览生成失败:", error);
            alert("生成预览时发生错误，请检查控制台。");
        } finally {
            generatingDiv.style.display = 'none';
            previewButton.disabled = false;
        }
    });

    downloadButton.addEventListener('click', async () => {
        generatingDiv.style.display = 'flex';
        downloadButton.disabled = true;
        try {
            const tableData = getTableData();
            await createGanttChart(tableData, '项目计划甘特图.xlsx');
        } catch (error) {
            console.error("下载失败:", error);
            alert("下载Excel文件时发生错误，请检查控制台。");
        } finally {
            generatingDiv.style.display = 'none';
            downloadButton.disabled = false;
        }
    });

    // --- Table Manipulation ---
    function populateTable(data) {
        dataTableBody.innerHTML = '';
        data.forEach(item => createRow(item));
    }

    function createRow(item) {
        const row = document.createElement('tr');
        row.innerHTML = `
            <td contenteditable="true" data-key="阶段">${item.阶段}</td>
            <td contenteditable="true" data-key="工作子项">${item.工作子项}</td>
            <td contenteditable="true" data-key="开始日期">${item.开始日期}</td>
            <td contenteditable="true" data-key="结束日期">${item.结束日期}</td>
            <td class="text-center">
                <button class="delete-row bg-red-500 hover:bg-red-600 text-white text-xs font-bold py-1 px-2 rounded">删除</button>
            </td>
        `;
        dataTableBody.appendChild(row);
        row.querySelector('.delete-row').addEventListener('click', () => {
            row.remove();
            previewButton.disabled = false;
            downloadButton.disabled = true;
            visualizationSection.classList.add('hidden');
        });
        row.querySelectorAll('[contenteditable="true"]').forEach(cell => {
             cell.addEventListener('input', () => {
                downloadButton.disabled = true;
                visualizationSection.classList.add('hidden');
             });
        });
    }

    function getTableData() {
        return Array.from(dataTableBody.querySelectorAll('tr')).map(row => {
            const cells = row.querySelectorAll('[contenteditable="true"]');
            const rowData = {};
            cells.forEach(cell => rowData[cell.dataset.key] = cell.textContent.trim());
            return rowData;
        });
    }

    function getValidatedData(workData) {
        let originalRowCount = workData.length;
        let df = workData.map(d => ({
            ...d,
            开始日期: new Date(d.开始日期),
            结束日期: new Date(d.结束日期)
        })).filter(d => d.开始日期 instanceof Date && !isNaN(d.开始日期) && d.结束日期 instanceof Date && !isNaN(d.结束日期));

        let invalidRows = originalRowCount - df.length;
        if (df.length === 0) {
            alert("错误：所有任务行的日期都无效。请确保日期格式为 YYYY-MM-DD 且日期有效。");
            throw new Error("No valid data for processing.");
        }
        if (invalidRows > 0) alert(`提醒：已跳过 ${invalidRows} 行日期格式无效的任务。`);

        // 关键改动：现在以“开始日期”为主要排序依据，确保任务按时间顺序排列
        df.sort((a, b) => a.开始日期 - b.开始日期);

        return df;
    }

    // --- High-Fidelity Visualization (FIXED with NO MERGING) ---
    function renderGanttChartVisualization(workData) {
        const df = getValidatedData(workData);

        const allTaskDates = [...new Set([...df.map(d => d.开始日期.getTime()), ...df.map(d => d.结束日期.getTime())])].map(time => new Date(time));
        const calendarDates = allTaskDates.sort((a, b) => a - b);

        const uniquePhases = [...new Set(df.map(d => d.阶段))];
        const colors = ['#B7DEE8', '#FCD5B4', '#C4D79B', '#D8BFD8', '#B7DDE8', '#FFDFDD', '#FFFACD'];
        const phaseColorMap = uniquePhases.reduce((acc, phase, i) => ({ ...acc, [phase]: colors[i % colors.length] }), {});

        ganttChartContainer.innerHTML = '';
        const grid = document.createElement('div');
        grid.className = 'gantt-container';
        grid.style.gridTemplateColumns = `150px 300px repeat(${calendarDates.length}, minmax(110px, 1fr))`;

        let html = '';

        // Render Headers
        html += `<div class="gantt-cell gantt-header" style="grid-column: 1 / 3; grid-row: 1;"></div>`;
        html += `<div class="gantt-cell gantt-header" style="grid-column: 3 / ${3 + calendarDates.length}; grid-row: 1;">工作日</div>`;
        html += `<div class="gantt-cell gantt-header" style="grid-column: 1; grid-row: 2;">阶段</div>`;
        html += `<div class="gantt-cell gantt-header" style="grid-column: 2; grid-row: 2;">工作子项</div>`;
        calendarDates.forEach((date, i) => {
            const dateString = date.toLocaleDateString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit' });
            html += `<div class="gantt-cell gantt-header" style="grid-column: ${i + 3}; grid-row: 2;">${dateString}</div>`;
        });

        // Render Body (Simplified Logic)
        df.forEach((task, i) => {
            const taskRow = i + 3; // Grid rows for body start at 3

            // Phase cell (repeated for each row)
            html += `<div class="gantt-cell gantt-phase" style="grid-column: 1; grid-row: ${taskRow};">${task.阶段}</div>`;

            // Task cell
            html += `<div class="gantt-cell gantt-task" style="grid-column: 2; grid-row: ${taskRow};">${task.工作子项}</div>`;

            // Date cells
            calendarDates.forEach((calDate, j) => {
                let bgColor = '';
                if (calDate >= task.开始日期 && calDate <= task.结束日期) {
                    bgColor = `background-color: ${phaseColorMap[task.阶段]};`;
                }
                html += `<div class="gantt-cell" style="grid-column: ${j + 3}; grid-row: ${taskRow}; ${bgColor}"></div>`;
            });
        });

        grid.innerHTML = html;
        ganttChartContainer.appendChild(grid);
        visualizationSection.classList.remove('hidden');
    }

    // --- Excel Generation Logic (Unchanged) ---
    async function createGanttChart(workData, outputFilename) {
        const df = getValidatedData(workData);
        const workbook = await XlsxPopulate.fromBlankAsync();
        const ganttSheet = workbook.sheet("Sheet1").name("项目进度");
        const dataSheet = workbook.addSheet("原始数据");

        const allTaskDates = [...new Set([...df.map(d => d.开始日期.getTime()), ...df.map(d => d.结束日期.getTime())])].map(time => new Date(time));
        const calendarDates = allTaskDates.sort((a, b) => a - b);

        // In Excel, we still group for merging, so we need to find the unique, ordered phases.
        const orderedPhases = [];
        const phaseGroups = {};
        df.forEach(task => {
            if (!phaseGroups[task.阶段]) {
                orderedPhases.push(task.阶段);
            }
            phaseGroups[task.阶段] = [...(phaseGroups[task.阶段] || []), task];
        });

        const colors = ['B7DEE8', 'FCD5B4', 'C4D79B', 'D8BFD8', 'B7DDE8', 'FFDFDD', 'FFFACD'];
        const phaseColorMap = orderedPhases.reduce((acc, phase, i) => ({ ...acc, [phase]: colors[i % colors.length] }), {});

        ganttSheet.gridLinesVisible(false);

        const headerStyle = { bold: true, horizontalAlignment: "center", verticalAlignment: "center", fill: "D9D9D9", border: true };
        const fullBorderStyle = { border: true };

        ganttSheet.range(1, 3, 1, 2 + calendarDates.length).merged(true).value("工作日").style(headerStyle);
        ganttSheet.cell(1, 1).value(null).style({ topBorder: true, leftBorder: true });
        ganttSheet.cell(1, 2).value(null).style({ topBorder: true, rightBorder: true });
        ganttSheet.cell(2, 1).value("阶段").style(headerStyle);
        ganttSheet.cell(2, 2).value("工作子项").style(headerStyle);
        calendarDates.forEach((date, i) => {
            ganttSheet.cell(2, i + 3).value(date).style(headerStyle).style("numberFormat", "yyyy/mm/dd");
        });

        let rowOffset = 3;
        orderedPhases.forEach(phase => {
            const group = phaseGroups[phase];
            const startRow = rowOffset;
            const endRow = rowOffset + group.length - 1;
            const phaseStyle = { ...fullBorderStyle, bold: true, horizontalAlignment: "center", verticalAlignment: "center", wrapText: true };
            if (group.length > 1) {
                ganttSheet.range(startRow, 1, endRow, 1).merged(true).value(phase).style(phaseStyle);
            } else {
                ganttSheet.cell(startRow, 1).value(phase).style(phaseStyle);
            }

            group.forEach((task, i) => {
                const currentRow = rowOffset + i;
                ganttSheet.cell(currentRow, 2).value(task.工作子项).style({ ...fullBorderStyle, horizontalAlignment: "left", verticalAlignment: "center" });
                calendarDates.forEach((calDate, j) => {
                    const cellStyle = { ...fullBorderStyle };
                    if (calDate >= task.开始日期 && calDate <= task.结束日期) {
                        cellStyle.fill = phaseColorMap[task.阶段];
                    }
                    ganttSheet.cell(currentRow, j + 3).style(cellStyle);
                });
            });
            rowOffset += group.length;
        });

        ganttSheet.column(1).width(15);
        ganttSheet.column(2).width(30);
        for (let i = 0; i < calendarDates.length; i++) ganttSheet.column(i + 3).width(12);
        ganttSheet.panes({ activePane: "bottomRight", state: "frozen", xSplit: 2, ySplit: 2 });

        const dataHeaderStyle = { bold: true, fill: "D9D9D9" };
        const dataHeaders = ["阶段", "工作子项", "开始日期", "结束日期"];
        dataHeaders.forEach((header, i) => dataSheet.cell(1, i + 1).value(header).style(dataHeaderStyle));
        workData.forEach((row, i) => {
            dataSheet.cell(i + 2, 1).value(row.阶段);
            dataSheet.cell(i + 2, 2).value(row.工作子项);
            dataSheet.cell(i + 2, 3).value(row.开始日期);
            dataSheet.cell(i + 2, 4).value(row.结束日期);
        });
        dataSheet.freezePanes(1, 0);

        const blob = await workbook.outputAsync();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement("a");
        document.body.appendChild(a);
        a.href = url;
        a.download = outputFilename;
        a.click();
        window.URL.revokeObjectURL(url);
        document.body.removeChild(a);
    }
});
</script>

</body>
</html>
